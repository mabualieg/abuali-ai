<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AbuAli AI — Legal</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5c6470; --line:#e6e8eb;
    --accent:#2563eb; --card:#f7f8fa;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65; font-size:17px;
  }
  .wrap{max-width:720px; margin:0 auto; padding:56px 20px 80px}
  header{margin-bottom:8px}
  .logo{
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:14px;
    background:var(--accent); color:#fff; font-weight:700; font-size:20px;
    letter-spacing:.5px; margin-bottom:20px;
  }
  h1{font-size:30px; line-height:1.2; margin:0 0 10px}
  p.lead{color:var(--muted); font-size:18px; margin:0 0 36px}
  .links{list-style:none; padding:0; margin:0}
  .links li{margin:0 0 14px}
  .links a{
    display:block; text-decoration:none; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; transition:border-color .15s ease, background .15s ease;
  }
  .links a:hover{border-color:var(--accent); background:#fff}
  .links .t{font-weight:600; font-size:17px}
  .links .d{color:var(--muted); font-size:15px; margin-top:2px}
  .arrow{float:right; color:var(--accent); font-weight:600}
  footer{margin-top:48px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted); font-size:14px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">AA</div>
      <h1>AbuAli AI</h1>
      <p class="lead">Legal information and policies for AbuAli AI, a personal AI assistant.</p>
    </header>

    <ul class="links">
      <li>
        <a href="privacy.html">
          <span class="arrow">&rarr;</span>
          <span class="t">Privacy Policy</span>
          <div class="d">How AbuAli AI processes and protects information.</div>
        </a>
      </li>
      <li>
        <a href="data-deletion.html">
          <span class="arrow">&rarr;</span>
          <span class="t">Data Deletion Instructions</span>
          <div class="d">How to request deletion of your personal information.</div>
        </a>
      </li>
    </ul>

    <footer>
      Contact: <a href="mailto:mabualieg@gmail.com">mabualieg@gmail.com</a>
    </footer>
  </div>
</body>
</html>
